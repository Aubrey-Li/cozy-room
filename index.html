<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cozy Room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23111%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22%23e4ad4c%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./book.css">
  <link rel="stylesheet" href="./game.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="card" id="hud-card">
      <div class="row">
        <button id="hud-summary" class="summary" type="button" aria-expanded="true" aria-controls="hud-body" title="Show or hide controls">
          <span id="clock">--:--</span>
          <span id="phase">&nbsp;</span>
        </button>
        <div class="hud-actions">
          <button id="sound-toggle" class="icon-btn" type="button" aria-pressed="true" aria-label="Turn sound off" title="Sound on">
            <svg class="i-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="i-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="hud-toggle" class="icon-btn" type="button" aria-expanded="true" aria-controls="hud-body" aria-label="Hide controls">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div id="hud-body">
        <div class="hud-inner">
          <div class="controls">
            <input id="time-slider" type="range" min="0" max="1439" step="1" value="720" aria-label="Scrub time of day">
            <button id="live-btn" type="button">Live</button>
          </div>
          <div class="controls" id="season-controls">
            <input id="date-slider" type="range" min="0" max="364" step="1" value="0" aria-label="Scrub through the year">
            <button id="today-btn" type="button">Today</button>
          </div>
          <div class="almanac" id="almanac"></div>
          <div class="hint" id="hint"></div>
        </div>
      </div>
    </div>
  </div>

  <section id="music" class="card music" hidden aria-label="Record player">
    <header class="music-head">
      <button id="music-summary" class="music-summary" type="button" aria-controls="music-list" title="Show or hide the song list">
        <span class="note" aria-hidden="true">♪</span>
        <span class="mini-disc" aria-hidden="true"></span>
        <span class="music-heading">On the turntable</span>
        <span class="now" id="music-now"><span class="now-title"></span><span class="now-artist"></span></span>
      </button>
      <div class="head-actions">
        <button id="music-playpause" class="icon-btn" type="button" aria-label="Pause" title="Pause">
          <svg class="i-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        </button>
        <button id="music-collapse" class="icon-btn" type="button" aria-expanded="true" aria-controls="music-list" aria-label="Minimize player" title="Minimize">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="music-close" class="icon-btn" type="button" aria-label="Stop and close" title="Stop and close">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>
    <ul id="music-list" class="tracks"></ul>
    <p id="music-status" class="music-status" hidden></p>
    <div id="music-player" class="player" hidden></div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
